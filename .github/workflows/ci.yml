name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://user:pass@localhost:5432/barato
      DATABASE_URL_UNPOOLED: postgresql://user:pass@localhost:5432/barato
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-secret-must-be-32-bytes-long-aaaa' }}
      AUTH_URL: http://localhost:3000
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET || 'ci-revalidate-secret-16b' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-typecheck-test
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://user:pass@localhost:5432/barato
      DATABASE_URL_UNPOOLED: postgresql://user:pass@localhost:5432/barato
      AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-secret-must-be-32-bytes-long-aaaa' }}
      AUTH_URL: http://localhost:3000
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET || 'ci-revalidate-secret-16b' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm build

  audit:
    name: pnpm audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
