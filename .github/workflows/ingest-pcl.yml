name: PCL Ingestion (SEPA)

on:
  schedule:
    - cron: "0 12 * * *"   # diario 12:00 UTC = 9am ART, tras publicación SEPA
  workflow_dispatch:
    inputs:
      day_override:
        description: "Override día (opcional: lunes|martes|miercoles|jueves|viernes|sabado|domingo) — sin tildes"
        required: false
        type: choice
        options:
          - lunes
          - martes
          - miercoles
          - jueves
          - viernes
          - sabado
          - domingo

concurrency:
  group: ingest-pcl
  cancel-in-progress: false

jobs:
  pcl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: ${{ secrets.AUTH_URL }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN_INGEST }}
      # day_override se pasa como env var para que el código use su mapa interno SEPA_DAILY_URLS
      SEPA_DAY_OVERRIDE: ${{ github.event.inputs.day_override }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm ingest pcl
      - name: Refresh materialized view + purge old prices (14d TTL)
        if: success()
        run: |
          pnpm prisma db execute --stdin --schema prisma/schema.prisma <<'SQL'
          REFRESH MATERIALIZED VIEW CONCURRENTLY price_daily_avg;
          DELETE FROM prices WHERE captured_at < NOW() - INTERVAL '14 days';
          DELETE FROM price_history WHERE captured_at < NOW() - INTERVAL '90 days';
          SQL
